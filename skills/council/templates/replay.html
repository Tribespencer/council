<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0b1020; --bg2:#121a30; --panel:#161f38; --line:#243055;
  --cream:#f3ead7; --muted:#9aa5c4; --amber:#f5b942; --amber2:#ffd27a;
  --for:#3ddc84; --against:#ff5c6c; --cond:#f5b942; --chair:#8fb4ff;
  --radius:18px; --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(1200px 600px at 50% -10%,#1b2650 0%,var(--bg) 60%)}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line)}
.wordmark{font-weight:900;letter-spacing:.22em;font-size:14px;color:var(--amber)}
.wordmark small{display:block;letter-spacing:.08em;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.q{flex:1;min-width:0}
.q .t{font-family:var(--serif);font-size:20px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q .s{font-size:12px;color:var(--muted);margin-top:3px}
.controls{display:flex;gap:8px;align-items:center}
button{background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:600 12px var(--font);cursor:pointer}
button:hover{border-color:var(--amber)} button.primary{background:var(--amber);color:#1a1200;border-color:var(--amber)}
select{background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font:600 12px var(--font)}

#seats{display:flex;justify-content:center;gap:18px;padding:14px 20px 8px;flex-wrap:wrap}
.seat{display:flex;flex-direction:column;align-items:center;width:92px;transition:transform .35s ease,opacity .35s}
.seat .av{width:68px;height:68px;border-radius:50%;background:var(--panel);border:3px solid var(--line);overflow:hidden;position:relative;transition:all .35s}
.seat .av img{width:100%;height:100%;object-fit:cover;object-position:center top;transform:scale(1.15) translateY(6%)}
.seat .n{font-size:11px;font-weight:700;margin-top:6px;text-align:center}
.seat .r{font-size:10px;color:var(--muted);text-align:center}
.seat.active{transform:translateY(-4px) scale(1.06)}
.seat.active .av{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,185,66,.18),0 0 28px rgba(245,185,66,.45)}
.seat.for .av{border-color:var(--for)} .seat.against .av{border-color:var(--against)} .seat.conditional .av{border-color:var(--cond)}
.seat.redteam .n::after{content:" 🎯"}
.seat .vote{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;padding:2px 6px;border-radius:999px;background:#000a;color:#fff;letter-spacing:.05em;opacity:0;transition:opacity .4s}
.seat .vote.show{opacity:1}

#stream{flex:1;overflow-y:auto;padding:10px 0 40px;scroll-behavior:smooth}
#stream::-webkit-scrollbar{width:6px} #stream::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.col{max-width:860px;margin:0 auto;padding:0 22px}
.divider{display:flex;align-items:center;gap:14px;margin:26px 0 14px;opacity:0;transform:translateY(10px);animation:in .5s forwards}
.divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.divider .lab{font-size:12px;letter-spacing:.2em;font-weight:900;color:var(--amber);text-transform:uppercase}
.divider .sub{font-size:12px;color:var(--muted);text-align:center;max-width:620px;margin:4px auto 0}
.divider .wrap{display:flex;flex-direction:column;align-items:center}
.msg{display:flex;gap:14px;margin:12px 0;opacity:0;transform:translateY(14px);animation:in .45s forwards}
.msg .av{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:var(--panel);overflow:hidden;border:2px solid var(--line);align-self:flex-start}
.msg .av img{width:100%;height:100%;object-fit:cover;object-position:center top;transform:scale(1.15) translateY(6%)}
.msg .bub{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 12px;position:relative;min-width:0}
.msg .bub::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.msg .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.msg .nm{font-weight:800;font-size:14px}
.msg .st{font-size:10px;color:var(--muted)}
.pill{font-size:10px;font-weight:900;letter-spacing:.08em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.pill.for{background:rgba(61,220,132,.15);color:var(--for)} .pill.against{background:rgba(255,92,108,.15);color:var(--against)} .pill.conditional{background:rgba(245,185,66,.15);color:var(--cond)}
.pill.reply{background:rgba(143,180,255,.12);color:var(--chair)} .pill.red{background:rgba(255,92,108,.2);color:#ffb3ba} .pill.src{background:rgba(255,255,255,.06);color:var(--muted)}
.msg .tx{font-size:15px;line-height:1.55}
.msg .tx .w{opacity:0;transition:opacity .18s} .msg .tx .w.on{opacity:1}
.msg .pq{margin-top:9px;font-family:var(--serif);font-style:italic;color:var(--amber2);font-size:15px;border-left:3px solid var(--amber);padding-left:10px;opacity:0;transition:opacity .5s}
.msg .pq.on{opacity:1}
.msg.chair .av{border-color:var(--chair)} .msg.chair .bub{background:transparent;border-style:dashed} .msg.chair .bub::before{display:none}
.msg.chair .tx{color:#c9d6ff;font-size:14px}
.research{background:linear-gradient(90deg,rgba(245,185,66,.08),transparent);border:1px dashed rgba(245,185,66,.4);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px;opacity:0;animation:in .5s forwards}
.research b{color:var(--amber)} .research ul{margin:6px 0 0;padding-left:18px;color:var(--muted)} .research li{margin:2px 0}

/* verdict */
#verdict{display:none;position:absolute;inset:0;background:radial-gradient(900px 500px at 50% 0%,#1d2a5a,var(--bg) 70%);overflow-y:auto}
#verdict.show{display:block;animation:in .6s forwards}
.vwrap{max-width:900px;margin:0 auto;padding:26px 22px 60px}
.vtop{text-align:center;margin-bottom:18px}
.vtop .lab{font-size:12px;letter-spacing:.3em;color:var(--amber);font-weight:900}
.vtop .big{font-family:var(--serif);font-size:72px;line-height:1.1;margin:8px 0 4px;font-weight:700;letter-spacing:-.02em;opacity:0;transform:translateY(12px) scale(.85);animation:stamp .6s .15s cubic-bezier(.2,1.2,.4,1) forwards}
.vtop .big.GO{color:var(--for)} .vtop .big.NO-GO{color:var(--against)} .vtop .big.GO-IF{color:var(--amber)} .vtop .big.SPLIT{color:var(--chair)}
.vtop .conf{color:var(--muted);font-size:13px}
.vtop .head{font-family:var(--serif);font-size:24px;margin:12px auto 0;max-width:720px;line-height:1.25}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h4{margin:0 0 10px;font-size:11px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
table.sc{width:100%;border-collapse:collapse;font-size:13px}
table.sc th{font-size:10px;color:var(--muted);text-align:center;font-weight:700;padding:4px 2px;letter-spacing:.05em}
table.sc td{padding:6px 2px;text-align:center;border-top:1px solid var(--line)}
table.sc td.nm{text-align:left;font-weight:700;display:flex;align-items:center;gap:8px}
table.sc td.nm img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:center top;border:1px solid var(--line);background:var(--bg2)}
table.sc tr.avg td{font-weight:900;color:var(--amber2);border-top:2px solid var(--amber)}
.v{font-weight:900;font-size:11px;letter-spacing:.05em}
.v.GO{color:var(--for)} .v.NO-GO{color:var(--against)} .v.GO-IF{color:var(--amber)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:92px 1fr 32px;align-items:center;gap:10px;font-size:12px}
.bar .tr{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:5px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar .nv{text-align:right;font-weight:800;color:var(--amber2)}
.list{margin:0;padding-left:18px;font-size:14px;line-height:1.5} .list li{margin:5px 0}
.list .when{color:var(--muted);font-size:12px;margin-left:6px}
.dissent{display:flex;gap:14px;align-items:flex-start}
.dissent img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--against);background:var(--bg2)}
.dissent .t{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5}
.dissent .who{font-size:12px;color:var(--muted);margin-top:6px}
.summary{font-size:14px;line-height:1.6;color:#dcd4c2}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 22px;font-size:11px;color:var(--muted);background:linear-gradient(0deg,var(--bg) 60%,transparent);pointer-events:none}
footer b{color:var(--amber)}
.hint{font-size:10px;color:var(--muted);opacity:.8;white-space:nowrap}
@keyframes in{to{opacity:1;transform:none}}
@keyframes stamp{to{opacity:1;transform:none}}

/* Reel mode: vertical 9:16 stage for screen recording */
body.reel #stage{width:min(100vw,calc(100vh*9/16));height:100vh;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
body.reel header{flex-direction:column;align-items:flex-start;gap:6px;padding:18px 20px 10px}
body.reel .q .t{white-space:normal;font-size:22px}
body.reel .controls{display:none}
body.reel #seats{gap:8px;padding:8px 10px 4px}
body.reel .seat{width:64px} body.reel .seat .av{width:52px;height:52px} body.reel .seat .n{font-size:10px} body.reel .seat .r{display:none}
body.reel .msg .tx{font-size:18px;line-height:1.5} body.reel .msg .nm{font-size:16px} body.reel .msg .av{flex-basis:46px;width:46px;height:46px}
body.reel .msg .pq{font-size:17px}
body.reel .grid{grid-template-columns:1fr}
body.reel .vtop .big{font-size:64px}
body.reel footer{font-size:10px}
body.reel .hint{display:none}
@media (max-width:700px){.grid{grid-template-columns:1fr}.q .t{font-size:16px}.controls select{display:none}}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="wordmark">COUNCIL<small>__TAGLINE__</small></div>
    <div class="q"><div class="t" id="qtitle"></div><div class="s" id="qsub"></div></div>
    <div class="controls">
      <button id="play" class="primary">▶ Play</button>
      <button id="next">Next ›</button>
      <button id="skip">Verdict ⏭</button>
      <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button id="reel">Reel 9:16</button>
      <button id="restart">↺</button>
    </div>
  </header>
  <div id="seats"></div>
  <div id="stream"><div class="col" id="col"></div></div>
  <div id="verdict"><div class="vwrap" id="vwrap"></div></div>
  <footer><span><b>__PRODUCT__</b> by __NAME__ · __HANDLE__ · __URL__</span><span class="hint">space · play &nbsp; → · next &nbsp; v · verdict &nbsp; r · reel</span><span>AI personas, not the real people</span></footer>
</div>

<script id="council-session" type="application/json">__SESSION_JSON__</script>
<script id="council-avatars" type="application/json">__AVATARS_JSON__</script>
<script>
(function(){
  const S = JSON.parse(document.getElementById('council-session').textContent);
  const AV = JSON.parse(document.getElementById('council-avatars').textContent);
  const cast = Object.fromEntries(S.cast.map(c=>[c.id,c]));
  const panel = S.cast.filter(c=>c.id!=='chair');
  const params = new URLSearchParams(location.search);
  const $ = s=>document.querySelector(s);
  const esc = s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const av = id => AV[id] || AV[(cast[id]||{}).avatar] || '';
  const stanceOf = s => ({for:'for',against:'against',conditional:'conditional'})[s] || 'conditional';

  document.title = S.meta.title + ' · Council';
  $('#qtitle').textContent = S.meta.title;
  $('#qsub').textContent = (S.meta.date||'') + (S.meta.research?' · researched':'') + ' · ' + panel.length + ' panelists · 3 rounds';

  // seats
  const seatsEl = $('#seats');
  S.cast.forEach(c=>{
    const d=document.createElement('div'); d.className='seat'; d.id='seat-'+c.id;
    d.innerHTML=`<div class="av"><img src="${av(c.id)}" alt=""><span class="vote" id="vote-${c.id}"></span></div><div class="n">${esc(c.name.split(' ').slice(-1)[0]==='Chair'?'The Chair':c.name.split(' ').pop())}</div><div class="r">${esc(c.seat)}</div>`;
    seatsEl.appendChild(d);
  });

  // build a flat list of steps
  const steps=[];
  const redTeam = (S.rounds.find(r=>r.number===2)||{}).red_team;
  S.rounds.forEach((r,i)=>{
    steps.push({type:'divider',label:'Round '+r.number+' · '+r.title,sub:r.chair_intro,round:r.number,red:r.red_team});
    if(r.number===2 && S.meta.research && (S.research||[]).length){
      steps.push({type:'research',items:S.research});
    }
    r.turns.forEach(t=>steps.push({type:'turn',t,round:r.number,red:r.red_team}));
    if(r.chair_summary) steps.push({type:'chair',text:r.chair_summary});
  });
  steps.push({type:'verdict'});

  const col=$('#col'), stream=$('#stream');
  let i=0, playing=false, timer=null, speed=parseFloat(params.get('speed')||'1');
  $('#speed').value=String(speed in {0.75:1,1:1,1.5:1,2:1}?speed:1);

  function setActive(id, stance){
    document.querySelectorAll('.seat').forEach(s=>s.classList.remove('active'));
    if(!id) return;
    const s=document.getElementById('seat-'+id); if(!s) return;
    s.classList.add('active'); if(stance){ s.classList.remove('for','against','conditional'); s.classList.add(stanceOf(stance)); }
  }
  function scroll(){ stream.scrollTo({top:stream.scrollHeight,behavior:'smooth'}); }

  function wordsHTML(text){ return text.split(/(\s+)/).map(w=>/\s+/.test(w)?w:`<span class="w">${esc(w)}</span>`).join(''); }
  function revealWords(el, ms){
    const ws=[...el.querySelectorAll('.w')]; const per=Math.max(18, ms/Math.max(1,ws.length));
    ws.forEach((w,k)=>setTimeout(()=>{w.classList.add('on'); if(k%12===0) scroll();}, k*per));
    return ws.length*per;
  }

  function render(step){
    if(step.type==='divider'){
      const d=document.createElement('div'); d.className='divider';
      d.innerHTML=`<div class="line"></div><div class="wrap"><div class="lab">${esc(step.label)}</div>${step.sub?`<div class="sub">${esc(step.sub)}</div>`:''}</div><div class="line"></div>`;
      col.appendChild(d); setActive(null);
      document.querySelectorAll('.seat').forEach(s=>s.classList.remove('redteam'));
      if(step.red){ const s=document.getElementById('seat-'+step.red); if(s) s.classList.add('redteam'); }
      scroll(); return 1800;
    }
    if(step.type==='research'){
      const d=document.createElement('div'); d.className='research';
      d.innerHTML=`<b>Research desk</b> · ${step.items.length} findings pulled in between rounds<ul>${step.items.slice(0,4).map(x=>`<li>${esc(x.claim)}</li>`).join('')}${step.items.length>4?`<li>… and ${step.items.length-4} more in the report</li>`:''}</ul>`;
      col.appendChild(d); scroll(); return 2600;
    }
    if(step.type==='chair'){
      const c=cast.chair||{name:'The Chair'};
      const d=document.createElement('div'); d.className='msg chair';
      d.innerHTML=`<div class="av"><img src="${av('chair')}" alt=""></div><div class="bub"><div class="hd"><span class="nm">${esc(c.name)}</span><span class="st">round summary</span></div><div class="tx">${wordsHTML(step.text)}</div></div>`;
      col.appendChild(d); setActive('chair'); scroll();
      const n=step.text.split(/\s+/).length; return revealWords(d.querySelector('.tx'), n*170)+900;
    }
    if(step.type==='turn'){
      const t=step.t, c=cast[t.speaker]||{name:t.speaker,seat:''};
      const d=document.createElement('div'); d.className='msg';
      const isRed = step.round===2 && step.red===t.speaker;
      const reply = t.reply_to && cast[t.reply_to] ? `<span class="pill reply">↩ ${esc(cast[t.reply_to].name.split(' ').pop())}</span>`:'';
      const sourced = t.cites && t.cites.length ? `<span class="pill src">sourced</span>`:'';
      d.innerHTML=`<div class="av"><img src="${av(t.speaker)}" alt=""></div><div class="bub"><div class="hd"><span class="nm">${esc(c.name)}</span><span class="st">${esc(c.seat)}</span><span class="pill ${stanceOf(t.stance)}">${esc(t.stance)}</span>${reply}${isRed?'<span class="pill red">🎯 red team</span>':''}${sourced}</div><div class="tx">${wordsHTML(t.text)}</div>${t.pull_quote?`<div class="pq">“${esc(t.pull_quote)}”</div>`:''}</div>`;
      col.appendChild(d); setActive(t.speaker, t.stance); scroll();
      const n=t.text.split(/\s+/).length; const ms=revealWords(d.querySelector('.tx'), n*150);
      setTimeout(()=>{const pq=d.querySelector('.pq'); if(pq) pq.classList.add('on'); scroll();}, ms);
      if(step.round===3 && S.scorecard && S.scorecard.scores && S.scorecard.scores[t.speaker]){
        setTimeout(()=>{const v=document.getElementById('vote-'+t.speaker); if(v){v.textContent=S.scorecard.scores[t.speaker].vote; v.classList.add('show');}}, ms);
      }
      return ms+1400;
    }
    if(step.type==='verdict'){ showVerdict(); return 0; }
  }

  function showVerdict(){
    const D=S.decision||{}, SC=S.scorecard||{}, avg=SC.averages||{}, dims=SC.dimensions||['upside','survivability','odds','timing','fit'];
    const labels={upside:'Upside',survivability:'Surviv.',odds:'Odds',timing:'Timing',fit:'Fit'};
    const rows=panel.map(p=>{const s=(SC.scores||{})[p.id]||{}; return `<tr><td class="nm"><img src="${av(p.id)}" alt="">${esc(p.name.split(' ').pop())}</td>${dims.map(d=>`<td>${s[d]??'–'}</td>`).join('')}<td class="v ${esc(s.vote||'')}">${esc(s.vote||'')}</td></tr>`;}).join('');
    const avgRow=`<tr class="avg"><td class="nm">Council</td>${dims.map(d=>`<td>${avg[d]!=null?Number(avg[d]).toFixed(1):'–'}</td>`).join('')}<td></td></tr>`;
    const bars=dims.map(d=>`<div class="bar"><span>${labels[d]||d}</span><div class="tr"><div class="fl" data-w="${(avg[d]||0)*10}"></div></div><span class="nv">${avg[d]!=null?Number(avg[d]).toFixed(1):'–'}</span></div>`).join('');
    const dis=D.dissent&&cast[D.dissent.speaker]?`<div class="card"><h4>The dissent</h4><div class="dissent"><img src="${av(D.dissent.speaker)}" alt=""><div><div class="t">“${esc(D.dissent.text)}”</div><div class="who">${esc(cast[D.dissent.speaker].name)} · ${esc(cast[D.dissent.speaker].seat)}</div></div></div></div>`:'';
    const conds=(D.conditions||[]).length?`<div class="card"><h4>Conditions</h4><ol class="list">${D.conditions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:'';
    const acts=(D.actions||[]).length?`<div class="card"><h4>Do this</h4><ol class="list">${D.actions.map(a=>`<li>${esc(a.text)}${a.when?`<span class="when">${esc(a.when)}</span>`:''}</li>`).join('')}</ol></div>`:'';
    const kills=(D.kill_criteria||[]).length?`<div class="card"><h4>Kill criteria</h4><ul class="list">${D.kill_criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
    const split=D.split?`<div class="card"><h4>The split</h4><p class="summary"><b>${esc((D.split.camp_a||{}).members?.map(m=>cast[m]?.name.split(' ').pop()).join(', '))}:</b> ${esc((D.split.camp_a||{}).position)}</p><p class="summary"><b>${esc((D.split.camp_b||{}).members?.map(m=>cast[m]?.name.split(' ').pop()).join(', '))}:</b> ${esc((D.split.camp_b||{}).position)}</p><p class="summary"><b>Experiment to settle it:</b> ${esc(D.split.experiment)}</p></div>`:'';
    $('#vwrap').innerHTML=`
      <div class="vtop"><div class="lab">THE COUNCIL HAS DECIDED</div>
        <div class="big ${esc(D.verdict||'')}">${esc(D.verdict||'')}</div>
        <div class="conf">confidence ${D.confidence??'–'} / 100${redTeam&&cast[redTeam]?` · red team: ${esc(cast[redTeam].name.split(' ').pop())}`:''}</div>
        <div class="head">${esc(D.headline||'')}</div></div>
      <div class="grid">
        <div class="card"><h4>Scorecard</h4><table class="sc"><thead><tr><th style="text-align:left">Panelist</th>${dims.map(d=>`<th>${labels[d]||d}</th>`).join('')}<th>Vote</th></tr></thead><tbody>${rows}${avgRow}</tbody></table></div>
        <div class="card"><h4>Council average</h4><div class="bars">${bars}</div></div>
        <div class="card" style="grid-column:1/-1"><h4>The Chair's summary</h4><div class="summary">${esc(D.summary||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n\n/g,'<br><br>')}</div></div>
        ${split}${conds}${acts}${kills}${dis}
      </div>`;
    $('#verdict').classList.add('show');
    setTimeout(()=>document.querySelectorAll('.fl').forEach(f=>f.style.width=f.dataset.w+'%'),300);
    panel.forEach(p=>{const s=(SC.scores||{})[p.id]; const v=document.getElementById('vote-'+p.id); if(s&&v){v.textContent=s.vote;v.classList.add('show');}});
    playing=false; $('#play').textContent='▶ Play';
  }

  function step(){
    if(i>=steps.length) return;
    const ms=render(steps[i++]);
    if(playing && i<steps.length){ timer=setTimeout(step, ms/speed); }
  }
  function play(){ if(i>=steps.length) return; playing=true; $('#play').textContent='❚❚ Pause'; step(); }
  function pause(){ playing=false; clearTimeout(timer); $('#play').textContent='▶ Play'; }
  function next(){ pause(); step(); }
  function restart(){ pause(); i=0; col.innerHTML=''; $('#verdict').classList.remove('show'); setActive(null);
    document.querySelectorAll('.vote').forEach(v=>{v.classList.remove('show');v.textContent='';});
    document.querySelectorAll('.seat').forEach(s=>s.classList.remove('for','against','conditional','redteam')); }
  function toVerdict(){ pause(); while(i<steps.length-1){ const s=steps[i++]; if(s.type!=='verdict'){ const d=document.createElement('div'); d.style.display='none'; } } showVerdict(); i=steps.length; }
  function toggleReel(){ document.body.classList.toggle('reel'); }

  $('#play').onclick=()=>playing?pause():play();
  $('#next').onclick=next; $('#restart').onclick=restart; $('#skip').onclick=toVerdict; $('#reel').onclick=toggleReel;
  $('#speed').onchange=e=>{speed=parseFloat(e.target.value);};
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault(); playing?pause():play();}
    else if(e.key==='ArrowRight'){next();} else if(e.key==='v'){toVerdict();} else if(e.key==='r'){toggleReel();} else if(e.key==='Escape'){restart();}
  });
  if(params.get('reel')==='1') document.body.classList.add('reel');
  if(params.get('autoplay')==='1') setTimeout(play,600);
})();
</script>
</body>
</html>
